name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    # Runs the suite and fails the job if coverage falls below the thresholds in
    # vitest.config.ts. See CONTRIBUTING.md for the current floor.
    - name: Test with coverage gate
      run: npm run test:coverage
    # `if: always()` so a coverage failure still produces the report a reviewer
    # needs to see which lines the diff left untested.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: error
